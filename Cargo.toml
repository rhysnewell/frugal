[package]
name = "frugal"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Fast rosella prodigal: metagenomic gene prediction, a fork of prodigal-rs"
license = "GPL-3.0-only"
authors = ["Rhys Newell <rhys.newell94@gmail.com>"]
repository = "https://github.com/rhysnewell/frugal"
homepage = "https://github.com/rhysnewell/frugal"
documentation = "https://docs.rs/frugal"
keywords = ["bioinformatics", "genomics", "gene-prediction", "prokaryote", "metagenomics"]
categories = ["science", "command-line-utilities"]
readme = "README.md"
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/examples/*.rs",
    "/tests/data/*",
    "/data/*.bin",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
]

[lib]
name = "frugal"
path = "src/lib.rs"

[[bin]]
name = "frugal"
path = "src/main.rs"
test = false

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
rayon = "1.12"

[dev-dependencies]
tempfile = "3"

[features]
compare-c = []
